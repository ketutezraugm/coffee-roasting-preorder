openapi: 3.0.3
info:
  title: production service
  version: 1.0.0
  description: |
    Roasting and packing. Owns production batches and their packing lines.
    Weights are integers in grams.
    Errors always use {"error": "<Code>", "message": "<text>"}.
servers:
  - url: http://localhost:3002

paths:
  /health:
    get:
      summary: Liveness check
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }

  /production-batches:
    post:
      summary: Receive a closed batch from ordering
      description: |
        Sending the same batchId again returns 200 with the existing production
        batch and changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewProductionBatch" }
      responses:
        "201":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductionBatchCreated" }
        "200":
          description: Already received, existing batch returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductionBatchCreated" }
        "422":
          description: InvalidProductionBatch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      summary: List production batches (the roaster's queue)
      description: Newest first. batchId is the id ordering sent, so a batch can be matched to its source.
      responses:
        "200":
          description: All production batches
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [productionBatchId, batchId, beanName, roastLevel, status]
                  properties:
                    productionBatchId: { type: string }
                    batchId: { type: string }
                    beanName: { type: string }
                    roastLevel: { type: string, enum: [light, medium, dark] }
                    status: { type: string, enum: [Queued, Roasted, Packed] }

  /production-batches/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      summary: Status and lines of a production batch
      responses:
        "200":
          description: The production batch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductionBatch" }
        "404": { $ref: "#/components/responses/NotFound" }

  /production-batches/{id}/roast:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      summary: Record the roast result
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actualSellableGrams]
              properties:
                actualSellableGrams: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Roasted
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [Roasted] }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: InvalidRoast
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: AlreadyRoasted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /production-batches/{id}/packing-list:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      summary: What to grind and pack per order
      responses:
        "200":
          description: Packing list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [orderId, packSizeGrams, grind, quantity, packed]
                  properties:
                    orderId: { type: string }
                    packSizeGrams: { type: integer }
                    grind: { type: string, enum: [wholeBean, filter, espresso] }
                    quantity: { type: integer }
                    packed: { type: boolean }
        "404": { $ref: "#/components/responses/NotFound" }

  /production-batches/{id}/lines/{orderId}/pack:
    parameters:
      - $ref: "#/components/parameters/id"
      - $ref: "#/components/parameters/orderId"
    post:
      summary: Mark one order packed
      description: |
        Also tells fulfilment the order is ready to ship (call 3). Safe to call again if
        that returns 502; once fulfilment has confirmed, calling it again returns 409 AlreadyPacked.
      responses:
        "200":
          description: Packed
          content:
            application/json:
              schema:
                type: object
                required: [lineStatus, batchStatus]
                properties:
                  lineStatus: { type: string, enum: [Packed] }
                  batchStatus: { type: string, enum: [Roasted, Packed] }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: NotRoasted or AlreadyPacked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                notRoasted: { value: { error: NotRoasted, message: "Record the roast first" } }
                packed: { value: { error: AlreadyPacked, message: "Line already packed" } }
        "502":
          description: DownstreamUnavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: string }
    orderId:
      name: orderId
      in: path
      required: true
      schema: { type: string }

  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }

    Line:
      type: object
      required: [orderId, packSizeGrams, grind, quantity]
      properties:
        orderId: { type: string }
        packSizeGrams: { type: integer, enum: [100, 250, 500, 1000] }
        grind: { type: string, enum: [wholeBean, filter, espresso] }
        quantity: { type: integer, minimum: 1 }

    NewProductionBatch:
      type: object
      required: [batchId, beanName, roastLevel, lines]
      properties:
        batchId: { type: string }
        beanName: { type: string }
        roastLevel: { type: string, enum: [light, medium, dark] }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Line" }

    ProductionBatchCreated:
      type: object
      required: [productionBatchId, status]
      properties:
        productionBatchId: { type: string }
        status: { type: string, enum: [Queued, Roasted, Packed] }

    ProductionBatch:
      type: object
      required: [productionBatchId, status, lines]
      properties:
        productionBatchId: { type: string }
        status: { type: string, enum: [Queued, Roasted, Packed] }
        actualSellableGrams: { type: integer }
        lines:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/Line"
              - type: object
                required: [packed]
                properties:
                  packed: { type: boolean }
